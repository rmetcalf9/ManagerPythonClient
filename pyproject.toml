[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ManagerPythonClient"
version = "0.0.4"
description = "Manager python client for accessing API."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Robert Metcalf" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
    "PythonAPIClientBase==0.0.19",
    "InquirerPy==0.3.4"
]

[project.urls]
Homepage = "https://github.com/rmetcalf9/ManagerPythonClient"
Repository = "https://github.com/rmetcalf9/ManagerPythonClient"

[tool.hatch.build.targets.wheel]
packages = ["src/manager_python_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
